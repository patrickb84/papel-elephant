# All the words on the website, in one place.
#
# Edit the text after a colon. Keep the indentation (two spaces per level)
# and the dashes in lists. Text containing a colon or starting with a quote
# mark needs "double quotes" around it; longer text can use ">-" and wrap
# onto indented lines below it. Rebuild (or keep `npm run dev` running) to
# see changes.
#
# Ideas for later live in TODO.md at the project root.

site:
  name: Paper Elephant Publishing
  url: https://paperelephantpublishing.com
  # The press's contact address: shown on About and used when the form fails.
  email: hello@paperelephantpublishing.com
  # Top bar links, in order.
  nav:
    - label: First lines
      href: /
    - label: Books
      href: /books/
    - label: Editing
      href: /editing/
    - label: About
      href: /about/
  copyright: Paper Elephant Publishing
  # At the foot of the phone menu, with the Instagram link.
  contactLink:
    label: Contact
    href: /about/#contact
  # Shown in the footer, the phone menu and the About contact section.
  instagram:
    label: Instagram
    handle: "@paper_elephant_publishing"
    href: https://www.instagram.com/paper_elephant_publishing/

# The page shown for an address that doesn't exist.
notFound:
  pageTitle: Page not found · Paper Elephant Publishing
  heading: This page is out of print.
  text: The address may be mistyped, or the page has moved. Try one of these instead.
  links:
    - label: Read a first line
      href: /
    - label: See our books
      href: /books/
    - label: Get in touch
      href: /about/#contact

# The home page: an opening line beside a painting.
firstLines:
  pageTitle: First Lines · Paper Elephant Publishing
  description: The opening lines of classic novels, each set beside a painting from the years it was written. Read any of them free on Project Gutenberg.
  kicker: First lines
  readButton: Read the book
  shuffleButton: Another book
  imageMissing: The painting could not be loaded.
  # The credits row under the page, for the book on screen.
  credits:
    painting: Painting
    portrait: Portrait
    text: Text
    selfPortrait: self-portrait
    textSource: Project Gutenberg
    portraitSource: Wikimedia Commons

# The Editing & Ghostwriting page. Copy carried over from raileebradshaw.com
# (November 2026). Don't add rates, packages, turnaround times or results
# claims unless Railee confirms them.
editing:
  pageTitle: Editing & Ghostwriting · Paper Elephant Publishing
  description: Book editing and ghostwriting from Railee Bradshaw, an Oregon author and editor.
  intro:
    kicker: For writers
    heading:
      - Editing &
      - ghostwriting.
    lede: >-
      Railee Bradshaw, the owner of Paper Elephant Publishing,
      edits and ghostwrites books for other writers.
    paragraphs:
      - >-
        She holds a degree in English/Writing and Communications from Eastern
        Oregon University, has edited books for other authors, ghostwritten a
        spiritual memoir, and written and published her own novel,
        _The Gingerbread House_. She is especially drawn to projects that
        involve research.
  # From AmyJae Springer's Amazon review of The Gingerbread House (Kindle),
  # December 11, 2025. The review discloses the editing relationship; keep the
  # attribution saying she is an editing client reviewing the novel.
  testimonial:
    quote: "…the brilliant editor behind my own books."
    name: AmyJae Springer
    role: author and editing client, reviewing
    work: The Gingerbread House
    workHref: /books/#the-gingerbread-house
    source: on Amazon
  services:
    heading: Services
    # Each service links to the contact form with its topic chosen; `ask` is
    # that link's text, so it should say what the visitor is asking about.
    items:
      - name: Developmental editing
        text: Clear, honest notes on story, structure, character and pacing, and a plan for your next draft.
        ask: Ask about editing
        topic: Editing
      - name: Ghostwriting
        text: Your story in your voice, written with you from the first conversation to the finished manuscript.
        ask: Ask about ghostwriting
        topic: Ghostwriting
      - name: Research / story support
        text: Facts checked, history dug up and plot problems untangled, for the parts of a book that need digging.
        ask: Ask about research
        topic: Research / story support
      - name: Something else
        text: Not sure what you need yet? Describe the project and Railee will tell you plainly how she can help.
        ask: Describe your project
        topic: Editing or ghostwriting (not sure)
  cta:
    kicker: Get in touch
    heading: Start a conversation
    text: Tell Railee about your project, even if it doesn't fit one of the services above.
    button: Send Railee an inquiry
    # Which contact-form topic the button chooses.
    topic: Editing or ghostwriting (not sure)

# The Books page. Each book's details are in content/books/<name>.yaml.
books:
  pageTitle: Books · Paper Elephant Publishing
  description: Books published by Paper Elephant Publishing.
  heading: Books
  lede: The books we publish, newest first.

about:
  pageTitle: About · Paper Elephant Publishing
  description: Paper Elephant Publishing is an independent literary press.

  intro:
    kicker: About the press
    heading:
      - Independent
      - publishing.
    lede: >-
      Paper Elephant Publishing is an independent press
      publishing works of fiction.
    paragraphs:
      - >-
        Our first publication is a Christmas romance.
        Additional titles will be announced as they become available.

  notes:
    - title: Publications
      text: >-
        Our catalog currently includes one title, with
        further projects in development.
      link:
        label: See our books
        href: /books/

    - title: Submissions
      text: >-
        We are accepting manuscript submissions. We're a small press,
        so we take on only a few books at a time, and replies can
        take a while.
      link:
        label: Send a submission
        href: /about/?topic=Submissions#contact

    - title: First Lines
      text: >-
        A collection of opening lines from classic literature,
        paired with artwork from the same period.
      link:
        label: Explore First Lines
        href: /

  contact:
    kicker: Contact
    heading: Get in touch
    text: >-
      For submissions, editing and ghostwriting, general inquiries, rights
      and permissions, or press-related matters, please use the form below.
    instagramPrefix: Follow us on Instagram
    emailPrefix: Or email
    # The subject line of the email each form message arrives as.
    emailSubject: New message from the Paper Elephant website
    # For these topics the form says who the message goes to and suggests
    # what to write. The Editing page's links choose the topic for the visitor.
    topicNotes:
      Editing:
        note: This goes straight to Railee Bradshaw, who takes on editing.
        hint: "Tell Railee about your book: what it is, roughly how long, where the draft stands, and the help you're after."
      Ghostwriting:
        note: This goes straight to Railee Bradshaw, who takes on ghostwriting.
        hint: "Tell Railee about the book you want written: the story, who it's for, and any notes or drafts you already have."
      Research / story support:
        note: This goes straight to Railee Bradshaw, who takes on research and story support.
        hint: "Tell Railee about your book and the part that needs digging: the history, the facts or the plot problem."
      Editing or ghostwriting (not sure):
        note: This goes straight to Railee Bradshaw.
        hint: Describe your project and where it stands. Railee will tell you plainly how she can help.
      Submissions:
        hint: "Tell us about your manuscript: title, genre, length and a short summary."
    # The editing page links here with ?topic=<one of these> to pre-select it.
    topics:
      - General inquiry
      - Submissions
      - Editing
      - Ghostwriting
      - Research / story support
      - Editing or ghostwriting (not sure)
      - Books and publications
      - Rights and permissions
      - Press and events
    labels:
      name: Name
      email: Email
      topic: Subject
      message: Message
      send: Send message
    errors:
      name: Please enter your name.
      email: Please enter your email address.
      emailInvalid: Please enter a valid email address.
      message: Please enter a message.
    status:
      sending: Sending…
      sent: Your message has been sent.
      # {email} is replaced by the address above.
      failed: Sorry, that didn't send. Please try again, or email {email}.
