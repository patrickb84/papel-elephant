# All the words on the website, in one place.
#
# Edit the text after a colon. Keep the indentation (two spaces per level)
# and the dashes in lists. Text containing a colon or starting with a quote
# mark needs "double quotes" around it; longer text can use ">-" and wrap
# onto indented lines below it. Rebuild (or keep `npm run dev` running) to
# see changes.
#
# Anything marked PLACEHOLDER is stand-in copy to replace before launch.

site:
  name: Paper Elephant Publishing
  url: https://paperelephantpublishing.com
  # PLACEHOLDER: the press's real contact address.
  email: hello@paperelephantpublishing.com
  # Top bar links, in order.
  nav:
    - label: First lines
      href: /
    - label: Editing
      href: /editing/
    - label: About
      href: /about/
  copyright: Paper Elephant Publishing

# The home page: an opening line beside a painting.
firstLines:
  pageTitle: First Lines · Paper Elephant Publishing
  description: The opening lines of classic novels, each set beside a painting from the years it was written. Read any of them free on Project Gutenberg.
  kicker: First lines
  readButton: Read the book
  shuffleButton: Another book
  imageMissing: The painting could not be loaded.
  # The credits row under the page, for the book on screen.
  credits:
    painting: Painting
    portrait: Portrait
    text: Text
    selfPortrait: self-portrait
    textSource: Project Gutenberg
    portraitSource: Wikimedia Commons

# The Editing & Ghostwriting page. Copy carried over from raileebradshaw.com
# (November 2026). Don't add rates, packages, turnaround times or results
# claims unless Railee confirms them.
editing:
  pageTitle: Editing & Ghostwriting · Paper Elephant Publishing
  description: Book editing and ghostwriting from Railee Bradshaw, an Oregon author and editor.
  intro:
    kicker: Editing & ghostwriting
    heading:
      - Editing &
      - ghostwriting.
    lede: >-
      Book editing and ghostwriting from Railee Bradshaw,
      the owner of Paper Elephant Publishing.
    paragraphs:
      - >-
        Railee is an editor and ghostwriter with a degree in English/Writing
        and Communications from Eastern Oregon University. She has edited
        books for other authors, ghostwritten a spiritual memoir, and written
        and published her own novel. She is especially drawn to projects that
        involve research.
      - Every project is different. If you are not sure whether yours is a fit, ask.
  # From AmyJae Springer's Amazon review of The Gingerbread House (Kindle),
  # December 11, 2025. The review discloses the editing relationship; keep the
  # attribution saying she is an editing client reviewing the novel.
  testimonial:
    quote: "…the brilliant editor behind my own books."
    name: AmyJae Springer
    role: author and editing client, reviewing
    work: The Gingerbread House
    source: on Amazon
  services:
    heading: Services
    # Shown on each service, linking to the contact form with its topic chosen.
    askLabel: Ask about this
    items:
      # TODO: Railee hasn't signed off on this service yet.
      - name: Developmental Editing
        text: Clear, honest notes on story, structure, character and pacing, and a plan for your next draft.
        topic: Editing
      # TODO: Railee hasn't signed off on this service yet.
      - name: Ghostwriting
        text: Your story in your voice, written with you from the first conversation to the finished manuscript.
        topic: Ghostwriting
      # TODO: Railee hasn't signed off on this service yet.
      - name: Research / Story Support
        text: Facts checked, history dug up and plot problems untangled, for the parts of a book that need digging.
        topic: Research / story support
      - name: Other / Not Sure
        text: Not sure what you need yet? Describe the project and Railee will tell you plainly how she can help.
        topic: General enquiry
  cta:
    kicker: Get in touch
    heading: Start a conversation
    text: Tell Railee about your project, even if it does not fit neatly into one of the services above.
    button: Send Railee an inquiry
    # Which contact-form topic the button chooses.
    topic: General enquiry

about:
  pageTitle: About · Paper Elephant Publishing
  description: Paper Elephant Publishing is an independent literary press.

  intro:
    kicker: About the press
    heading:
      - Independent
      - publishing.
    lede: >-
      Paper Elephant Publishing is an independent press
      publishing works of fiction.
    paragraphs:
      - >-
        Our first publication is a Christmas romance.
        Additional titles will be announced as they become available.

  notes:
    - title: Publications
      text: >-
        Our catalog currently includes one title, with
        further projects in development.

    - title: Submissions
      text: >-
        We are not currently accepting manuscript submissions
        or publishing proposals.

    - title: First Lines
      text: >-
        A collection of opening lines from classic literature,
        paired with artwork from the same period.
      link:
        label: Explore First Lines
        href: /

  contact:
    kicker: Contact
    heading: Get in touch
    text: >-
      For editing and ghostwriting, general inquiries, rights and
      permissions, or press-related matters, please use the form below.
    emailPrefix: Or email
    # The editing page links here with ?topic=<one of these> to pre-select it.
    topics:
      - General enquiry
      - Editing
      - Ghostwriting
      - Research / story support
      - Books and publications
      - Rights and permissions
      - Press and events
    labels:
      name: Name
      email: Email
      topic: Subject
      message: Message
      send: Send message
    errors:
      name: Please enter your name.
      email: Please enter your email address.
      emailInvalid: Please enter a valid email address.
      message: Please enter a message.
    status:
      sending: Sending…
      sent: Your message has been sent.
      # {email} is replaced by the address above.
      failed: Sorry, that didn't send. Please try again, or email {email}.
      openedEmailApp: Your email app should open with the message ready to send.
